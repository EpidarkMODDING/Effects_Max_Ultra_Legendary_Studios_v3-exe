name: Build EXE (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Effects_Max_Ultra_Legendary_Studios
  MAIN_FILE: Effects_Max_Ultra_Legendary_Studios.py

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ubicar carpeta del proyecto
        shell: pwsh
        run: |
          $mainPath = Get-ChildItem -Recurse -Filter "$env:MAIN_FILE" -Exclude ".git" | Select-Object -First 1
          if (-not \$mainPath) {
            Write-Error "No se encontro \$env:MAIN_FILE en el repositorio"
            exit 1
          }
          $appDir =$mainPath.DirectoryName
          echo "APP_DIR=$appDir" >> $env:GITHUB_ENV
          Write-Host "Programa encontrado en: \$appDir"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Comprobar que compila y que los modulos importan
        working-directory: \${{ env.APP_DIR }}
        run: |
          python -m py_compile *.py
          python -c "import importlib; [importlib.import_module(mod) for mod in ('lang', 'recursos', 'bt3eff_core', 'ps2tex', 'texview', 'hexdocs', 'hexview', 'previa', 'editor3d', 'animacao', 'seletor_cor', 'tutoriais')]"

      - name: Compilar el .exe
        working-directory: \${{ env.APP_DIR }}
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "${{ env.APP_NAME }}" `
            --icon icone.ico `
            --hidden-import texview --hidden-import hexview --hidden-import hexdocs `
            --hidden-import previa --hidden-import editor3d --hidden-import animacao `
            --hidden-import seletor_cor --hidden-import tutoriais --hidden-import ps2tex `
            --hidden-import recursos --hidden-import lang --hidden-import bt3eff_core `
            --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk `
            "\${{ env.MAIN_FILE }}"

      - name: Armar la carpeta final
        working-directory: \${{ env.APP_DIR }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "dist/\${{ env.APP_NAME }}.exe" release/
          Copy-Item recursos.dat, icone.ico release/ -ErrorAction SilentlyContinue
          if (Test-Path LEIA-ME.txt) { Copy-Item LEIA-ME.txt release/ }
          \$folders = @('modelos', 'extras', 'cenas', 'auras', 'suportes', 'pre_disparo')
          foreach ($d in$folders) {
            if (Test-Path $d) { Copy-Item -Recurse$d release/ }
          }
          Get-ChildItem release

      - name: Subir el resultado (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Effects_Max_Ultra_Legendary_Studios_Windows
          path: \${{ env.APP_DIR }}/release/*
          if-no-files-found: error

      - name: Crear .zip para el Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: \${{ env.APP_DIR }}/release
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath "../Effects_Max_Ultra_Legendary_Studios_\${{ github.ref_name }}.zip"

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/Effects_Max_Ultra_Legendary_Studios_${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
